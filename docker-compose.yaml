services:
  postgres-db:
    image: postgres:17-alpine
    container_name: funcionarios-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: italo001/funcionarios-api:v1
    container_name: funcionarios-api
    restart: always
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DBPASSWORD}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  pgdata: